<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/>
    </marker>
    <marker id="arrow2blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect x="0" y="0" width="1000" height="230" fill="#ffffff"/>

  <!-- Model (the only colored element: it is interchangeable, but it is the star) -->
  <rect x="18" y="64" width="150" height="84" rx="8" fill="#2a78d6"/>
  <text x="93" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Model</text>
  <text x="93" y="122" text-anchor="middle" font-size="13" fill="#ffffff" fill-opacity="0.9">any LLM</text>
  <text x="93" y="172" text-anchor="middle" font-size="12.5" font-style="italic" fill="#52514e">closed &#183; open-weight &#183; local</text>

  <!-- Host app -->
  <rect x="300" y="64" width="160" height="84" rx="8" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.75"/>
  <text x="380" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#0b0b0b">Host app</text>
  <text x="380" y="122" text-anchor="middle" font-size="12.5" fill="#52514e">chat UI, IDE, workflow</text>

  <!-- MCP server -->
  <rect x="590" y="64" width="160" height="84" rx="8" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.75"/>
  <text x="670" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#0b0b0b">MCP server</text>
  <text x="670" y="122" text-anchor="middle" font-size="12.5" fill="#52514e">tools &#183; resources &#183; prompts</text>

  <!-- API / data source -->
  <rect x="850" y="64" width="132" height="84" rx="8" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.75"/>
  <text x="916" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#0b0b0b">API / data</text>
  <text x="916" y="122" text-anchor="middle" font-size="12" fill="#52514e">Open-Meteo, DB, ...</text>

  <!-- Model <-> Host: function calling -->
  <line x1="168" y1="106" x2="300" y2="106" stroke="#0b0b0b" stroke-width="2" marker-start="url(#arrow2)" marker-end="url(#arrow2)"/>
  <text x="234" y="86" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0b0b0b">function calling</text>
  <text x="234" y="130" text-anchor="middle" font-size="12" font-style="italic" fill="#52514e">(model-specific)</text>

  <!-- Host <-> Server: MCP -->
  <line x1="460" y1="106" x2="590" y2="106" stroke="#2a78d6" stroke-width="2.75" marker-start="url(#arrow2blue)" marker-end="url(#arrow2blue)"/>
  <text x="525" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a78d6">MCP</text>
  <text x="525" y="130" text-anchor="middle" font-size="12" font-style="italic" fill="#52514e">(standardized)</text>

  <!-- Server <-> API: ordinary code -->
  <line x1="750" y1="106" x2="850" y2="106" stroke="#0b0b0b" stroke-width="2" marker-start="url(#arrow2)" marker-end="url(#arrow2)"/>
  <text x="800" y="86" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0b0b0b">ordinary code</text>
  <text x="800" y="130" text-anchor="middle" font-size="12" font-style="italic" fill="#52514e">(HTTP, SQL, ...)</text>
</svg>
