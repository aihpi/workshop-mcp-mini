<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/>
    </marker>
    <marker id="arrowblue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="420" fill="#ffffff"/>

  <!-- Local machine boundary -->
  <rect x="116" y="52" width="566" height="342" rx="14" fill="none" stroke="#898781" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="134" y="386" font-size="14" font-style="italic" fill="#52514e">your machine</text>

  <!-- Remote boundary -->
  <rect x="730" y="182" width="252" height="224" rx="14" fill="none" stroke="#898781" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="855" y="201" text-anchor="middle" font-size="14" font-style="italic" fill="#52514e">remote</text>

  <!-- User -->
  <g fill="none" stroke="#0b0b0b" stroke-width="2">
    <circle cx="55" cy="205" r="13" fill="#ffffff"/>
    <path d="M32,246 a23,23 0 0 1 46,0"/>
  </g>
  <text x="55" y="272" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b0b0b">User</text>
  <line x1="88" y1="205" x2="138" y2="205" stroke="#0b0b0b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Host -->
  <rect x="140" y="72" width="290" height="300" rx="10" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.75"/>
  <text x="285" y="104" text-anchor="middle" font-size="18" font-weight="bold" fill="#0b0b0b">Host</text>
  <text x="285" y="126" text-anchor="middle" font-size="13" fill="#52514e">the app the user talks to</text>

  <!-- LLM chip -->
  <rect x="158" y="222" width="104" height="52" rx="8" fill="#2a78d6"/>
  <text x="210" y="254" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">LLM</text>

  <!-- MCP clients -->
  <g fill="#ffffff" stroke="#0b0b0b" stroke-width="1.5">
    <rect x="310" y="148" width="118" height="44" rx="8"/>
    <rect x="310" y="230" width="118" height="44" rx="8"/>
    <rect x="310" y="326" width="118" height="44" rx="8"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="bold" fill="#0b0b0b">
    <text x="369" y="175">MCP client</text>
    <text x="369" y="257">MCP client</text>
    <text x="369" y="353">MCP client</text>
  </g>

  <!-- Server 1: Knowledge (Resources), local/stdio -->
  <rect x="498" y="124" width="160" height="92" rx="8" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.75"/>
  <text x="578" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b0b0b">Knowledge server</text>
  <rect x="533" y="162" width="90" height="26" rx="13" fill="#ffffff" stroke="#898781" stroke-width="1.5"/>
  <text x="578" y="180" text-anchor="middle" font-size="13" fill="#52514e">Resources</text>
  <text x="578" y="205" text-anchor="middle" font-size="11.5" font-style="italic" fill="#898781">e.g. FAQ, files</text>

  <!-- Server 2: Weather (Tools), remote/HTTP -->
  <rect x="748" y="206" width="214" height="92" rx="8" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.75"/>
  <text x="855" y="234" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b0b0b">Weather server</text>
  <rect x="810" y="246" width="90" height="26" rx="13" fill="#ffffff" stroke="#898781" stroke-width="1.5"/>
  <text x="855" y="264" text-anchor="middle" font-size="13" fill="#52514e">Tools</text>
  <text x="855" y="289" text-anchor="middle" font-size="11.5" font-style="italic" fill="#898781">e.g. get_local_weather</text>

  <!-- Server 3: Helpdesk (Prompts), remote/HTTP -->
  <rect x="748" y="302" width="214" height="92" rx="8" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.75"/>
  <text x="855" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b0b0b">Helpdesk server</text>
  <rect x="810" y="342" width="90" height="26" rx="13" fill="#ffffff" stroke="#898781" stroke-width="1.5"/>
  <text x="855" y="360" text-anchor="middle" font-size="13" fill="#52514e">Prompts</text>
  <text x="855" y="385" text-anchor="middle" font-size="11.5" font-style="italic" fill="#898781">e.g. /triage-ticket</text>

  <!-- MCP connections (labels underneath the arrows) -->
  <line x1="428" y1="170" x2="498" y2="168" stroke="#2a78d6" stroke-width="2" marker-start="url(#arrowblue)" marker-end="url(#arrowblue)"/>
  <text x="463" y="186" text-anchor="middle" font-size="13" font-style="italic" fill="#52514e">MCP &#183; stdio</text>

  <line x1="428" y1="252" x2="748" y2="252" stroke="#2a78d6" stroke-width="2" marker-start="url(#arrowblue)" marker-end="url(#arrowblue)"/>
  <text x="582" y="270" text-anchor="middle" font-size="13" font-style="italic" fill="#52514e">MCP &#183; HTTP</text>

  <line x1="428" y1="348" x2="748" y2="348" stroke="#2a78d6" stroke-width="2" marker-start="url(#arrowblue)" marker-end="url(#arrowblue)"/>
  <text x="582" y="366" text-anchor="middle" font-size="13" font-style="italic" fill="#52514e">MCP &#183; HTTP</text>
</svg>
