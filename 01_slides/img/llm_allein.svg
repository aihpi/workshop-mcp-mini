<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="520" height="420" fill="#ffffff"/>

  <!-- ============ Titel ============ -->
  <text x="260" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#0b0b0b">The LLM on its own</text>

  <!-- ============ Fluss: Eingabe → LLM → Ausgabe ============ -->
  <rect x="20" y="122" width="120" height="56" rx="8" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.75"/>
  <text x="80" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#0b0b0b">Input</text>
  <text x="80" y="166" text-anchor="middle" font-size="14" fill="#52514e">Prompt</text>

  <line x1="140" y1="150" x2="190" y2="150" stroke="#0b0b0b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LLM node (the only colored element) -->
  <rect x="190" y="114" width="140" height="72" rx="8" fill="#2a78d6"/>
  <text x="260" y="146" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">LLM</text>
  <text x="260" y="168" text-anchor="middle" font-size="13" fill="#ffffff" fill-opacity="0.9">text in, text out</text>

  <line x1="330" y1="150" x2="380" y2="150" stroke="#0b0b0b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="380" y="122" width="120" height="56" rx="8" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.75"/>
  <text x="440" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#0b0b0b">Output</text>
  <text x="440" y="166" text-anchor="middle" font-size="14" fill="#52514e">Text</text>

  <!-- ============ Gekappte Verbindungen (kein Zugriff) ============ -->
  <g stroke="#898781" stroke-width="1.8" stroke-dasharray="5 4">
    <line x1="260" y1="186" x2="95" y2="272"/>
    <line x1="260" y1="186" x2="260" y2="272"/>
    <line x1="260" y1="186" x2="425" y2="272"/>
  </g>
  <g>
    <circle cx="177.5" cy="229" r="11" fill="#ffffff"/>
    <circle cx="260" cy="229" r="11" fill="#ffffff"/>
    <circle cx="342.5" cy="229" r="11" fill="#ffffff"/>
    <text x="177.5" y="234.5" text-anchor="middle" font-size="15" fill="#898781">&#10005;</text>
    <text x="260" y="234.5" text-anchor="middle" font-size="15" fill="#898781">&#10005;</text>
    <text x="342.5" y="234.5" text-anchor="middle" font-size="15" fill="#898781">&#10005;</text>
  </g>

  <!-- Nicht erreichbare Bausteine -->
  <g fill="#ffffff" stroke="#898781" stroke-width="1.5" stroke-dasharray="7 5">
    <rect x="20" y="272" width="150" height="48" rx="8"/>
    <rect x="185" y="272" width="150" height="48" rx="8"/>
    <rect x="350" y="272" width="150" height="48" rx="8"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="bold" fill="#898781">
    <text x="95" y="301">Tools</text>
    <text x="260" y="301">Your data</text>
    <text x="425" y="301">Memory</text>
  </g>

  <text x="260" y="356" text-anchor="middle" font-size="14" font-style="italic" fill="#52514e">no access, every call starts from zero</text>
</svg>
