<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>

  <!-- Pipeline enclosure: dashed hairline -->
  <rect x="14" y="34" width="874" height="332" rx="18" fill="none" stroke="#898781" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="34" y="352" font-size="14" font-style="italic" fill="#52514e">deterministic pipeline</text>

  <!-- Arrows / connectors -->
  <g stroke="#0b0b0b" stroke-width="2" fill="none">
    <!-- Eingang -> LLM -->
    <path d="M186,200 L227,200" marker-end="url(#arrow)"/>
    <!-- Split: stem + vertical + three branches -->
    <path d="M362,200 L471,200" marker-end="url(#arrow)"/>
    <path d="M398,100 L398,300"/>
    <path d="M398,100 L471,100" marker-end="url(#arrow)"/>
    <path d="M398,300 L471,300" marker-end="url(#arrow)"/>
    <!-- Merge: two elbows + arrow into Antwortentwurf -->
    <path d="M656,100 L702,100 L702,200"/>
    <path d="M656,300 L702,300 L702,200"/>
    <path d="M656,200 L739,200" marker-end="url(#arrow)"/>
  </g>
  <!-- Junction dots -->
  <circle cx="398" cy="200" r="3.5" fill="#0b0b0b"/>
  <circle cx="702" cy="200" r="3.5" fill="#0b0b0b"/>

  <!-- Branch labels -->
  <g fill="#52514e" font-size="14" text-anchor="middle">
    <text x="435" y="88">Billing</text>
    <text x="435" y="188">Support</text>
    <text x="435" y="288">Other</text>
  </g>

  <!-- E-Mail-Eingang -->
  <rect x="28" y="155" width="158" height="90" rx="8" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.75"/>
  <g stroke="#0b0b0b" stroke-width="2" fill="none">
    <rect x="85" y="168" width="44" height="28" rx="3"/>
    <path d="M87,170 L107,186 L127,170"/>
  </g>
  <text x="107" y="226" fill="#0b0b0b" font-size="16" font-weight="bold" text-anchor="middle">Incoming email</text>

  <!-- LLM node (the only colored element) -->
  <rect x="230" y="152" width="132" height="96" rx="8" fill="#2a78d6"/>
  <text x="296" y="196" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle">LLM</text>
  <text x="296" y="219" fill="#ffffff" fill-opacity="0.9" font-size="14" font-weight="bold" text-anchor="middle">Classification</text>

  <!-- Team boxes -->
  <rect x="474" y="72" width="182" height="56" rx="8" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.75"/>
  <text x="565" y="106" fill="#0b0b0b" font-size="16" font-weight="bold" text-anchor="middle">Accounting team</text>

  <rect x="474" y="172" width="182" height="56" rx="8" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.75"/>
  <text x="565" y="206" fill="#0b0b0b" font-size="16" font-weight="bold" text-anchor="middle">Tech team</text>

  <rect x="474" y="272" width="182" height="56" rx="8" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.75"/>
  <text x="565" y="306" fill="#0b0b0b" font-size="16" font-weight="bold" text-anchor="middle">General team</text>

  <!-- Antwortentwurf -->
  <rect x="742" y="168" width="140" height="64" rx="8" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.75"/>
  <text x="812" y="206" fill="#0b0b0b" font-size="16" font-weight="bold" text-anchor="middle">Draft reply</text>
</svg>
