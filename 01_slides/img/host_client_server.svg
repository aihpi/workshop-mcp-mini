<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/>
    </marker>
    <marker id="arrowblue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect x="0" y="0" width="980" height="360" fill="#ffffff"/>

  <!-- Local machine boundary -->
  <rect x="116" y="46" width="574" height="288" rx="14" fill="none" stroke="#898781" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="134" y="320" font-size="14" font-style="italic" fill="#52514e">your machine</text>

  <!-- Remote boundary -->
  <rect x="718" y="156" width="246" height="150" rx="14" fill="none" stroke="#898781" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="736" y="292" font-size="14" font-style="italic" fill="#52514e">remote</text>

  <!-- User -->
  <g fill="none" stroke="#0b0b0b" stroke-width="2">
    <circle cx="55" cy="155" r="13" fill="#ffffff"/>
    <path d="M32,196 a23,23 0 0 1 46,0"/>
  </g>
  <text x="55" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b0b0b">User</text>
  <line x1="88" y1="180" x2="128" y2="180" stroke="#0b0b0b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Host -->
  <rect x="130" y="70" width="290" height="220" rx="10" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.75"/>
  <text x="275" y="102" text-anchor="middle" font-size="18" font-weight="bold" fill="#0b0b0b">Host</text>
  <text x="275" y="124" text-anchor="middle" font-size="13" fill="#52514e">the app the user talks to</text>

  <!-- LLM chip (the only colored element) -->
  <rect x="152" y="150" width="105" height="52" rx="8" fill="#2a78d6"/>
  <text x="204.5" y="182" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">LLM</text>

  <!-- MCP clients -->
  <g fill="#ffffff" stroke="#0b0b0b" stroke-width="1.5">
    <rect x="283" y="142" width="118" height="40" rx="8"/>
    <rect x="283" y="208" width="118" height="40" rx="8"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="bold" fill="#0b0b0b">
    <text x="342" y="167">MCP client</text>
    <text x="342" y="233">MCP client</text>
  </g>

  <!-- Server A: local, stdio -->
  <rect x="512" y="112" width="158" height="96" rx="8" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.75"/>
  <text x="591" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b0b0b">Weather server</text>
  <rect x="556" y="160" width="70" height="26" rx="13" fill="#ffffff" stroke="#898781" stroke-width="1.5"/>
  <text x="591" y="178" text-anchor="middle" font-size="13" fill="#52514e">Tools</text>

  <!-- Server B: remote, HTTP -->
  <rect x="736" y="180" width="210" height="96" rx="8" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.75"/>
  <text x="841" y="214" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b0b0b">Knowledge server</text>
  <text x="841" y="242" text-anchor="middle" font-size="13" fill="#52514e">Tools &#183; Resources &#183; Prompts</text>

  <!-- MCP connections -->
  <line x1="401" y1="162" x2="512" y2="152" stroke="#2a78d6" stroke-width="2" marker-start="url(#arrowblue)" marker-end="url(#arrowblue)"/>
  <text x="456" y="138" text-anchor="middle" font-size="13" font-style="italic" fill="#52514e">MCP &#183; stdio</text>

  <line x1="401" y1="228" x2="736" y2="228" stroke="#2a78d6" stroke-width="2" marker-start="url(#arrowblue)" marker-end="url(#arrowblue)"/>
  <text x="560" y="250" text-anchor="middle" font-size="13" font-style="italic" fill="#52514e">MCP &#183; HTTP</text>
</svg>
