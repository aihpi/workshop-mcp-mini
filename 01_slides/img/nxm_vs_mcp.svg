<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">

  <!-- White background -->
  <rect x="0" y="0" width="1000" height="420" fill="#ffffff"/>

  <!-- Panel divider -->
  <line x1="500" y1="24" x2="500" y2="400" stroke="#898781" stroke-width="1.5" stroke-dasharray="7 5"/>

  <!-- ============ Left panel: without MCP ============ -->
  <text x="245" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0b0b0b">Without MCP</text>

  <!-- 12 point-to-point integrations (drawn first, boxes cover the ends) -->
  <g stroke="#898781" stroke-width="1.5">
    <line x1="185" y1="116" x2="300" y2="96"/>
    <line x1="185" y1="116" x2="300" y2="174"/>
    <line x1="185" y1="116" x2="300" y2="252"/>
    <line x1="185" y1="116" x2="300" y2="330"/>
    <line x1="185" y1="200" x2="300" y2="96"/>
    <line x1="185" y1="200" x2="300" y2="174"/>
    <line x1="185" y1="200" x2="300" y2="252"/>
    <line x1="185" y1="200" x2="300" y2="330"/>
    <line x1="185" y1="284" x2="300" y2="96"/>
    <line x1="185" y1="284" x2="300" y2="174"/>
    <line x1="185" y1="284" x2="300" y2="252"/>
    <line x1="185" y1="284" x2="300" y2="330"/>
  </g>

  <!-- Apps (left column) -->
  <g fill="#ffffff" stroke="#0b0b0b" stroke-width="1.75">
    <rect x="30" y="92" width="155" height="48" rx="8"/>
    <rect x="30" y="176" width="155" height="48" rx="8"/>
    <rect x="30" y="260" width="155" height="48" rx="8"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="bold" fill="#0b0b0b">
    <text x="107.5" y="121">Chat app</text>
    <text x="107.5" y="205">Workflow tool</text>
    <text x="107.5" y="289">IDE</text>
  </g>

  <!-- Tools (right column) -->
  <g fill="#ffffff" stroke="#0b0b0b" stroke-width="1.75">
    <rect x="300" y="74" width="160" height="44" rx="8"/>
    <rect x="300" y="152" width="160" height="44" rx="8"/>
    <rect x="300" y="230" width="160" height="44" rx="8"/>
    <rect x="300" y="308" width="160" height="44" rx="8"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="bold" fill="#0b0b0b">
    <text x="380" y="101">Weather API</text>
    <text x="380" y="179">Database</text>
    <text x="380" y="257">E-mail</text>
    <text x="380" y="335">Files</text>
  </g>

  <text x="245" y="396" text-anchor="middle" font-size="14" font-style="italic" fill="#52514e">3 &#215; 4 = 12 point-to-point integrations</text>

  <!-- ============ Right panel: with MCP ============ -->
  <text x="755" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0b0b0b">With MCP</text>

  <!-- Connections into and out of MCP -->
  <g stroke="#2a78d6" stroke-width="2">
    <line x1="690" y1="116" x2="725" y2="168"/>
    <line x1="690" y1="200" x2="725" y2="200"/>
    <line x1="690" y1="284" x2="725" y2="232"/>
    <line x1="799" y1="150" x2="830" y2="96"/>
    <line x1="799" y1="185" x2="830" y2="174"/>
    <line x1="799" y1="215" x2="830" y2="252"/>
    <line x1="799" y1="250" x2="830" y2="330"/>
  </g>

  <!-- Apps (left column) -->
  <g fill="#ffffff" stroke="#0b0b0b" stroke-width="1.75">
    <rect x="540" y="92" width="150" height="48" rx="8"/>
    <rect x="540" y="176" width="150" height="48" rx="8"/>
    <rect x="540" y="260" width="150" height="48" rx="8"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="bold" fill="#0b0b0b">
    <text x="615" y="121">Chat app</text>
    <text x="615" y="205">Workflow tool</text>
    <text x="615" y="289">IDE</text>
  </g>

  <!-- MCP node (the only colored element) -->
  <rect x="725" y="130" width="74" height="140" rx="12" fill="#2a78d6"/>
  <text x="762" y="206" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff">MCP</text>

  <!-- Tools (right column) -->
  <g fill="#ffffff" stroke="#0b0b0b" stroke-width="1.75">
    <rect x="830" y="74" width="150" height="44" rx="8"/>
    <rect x="830" y="152" width="150" height="44" rx="8"/>
    <rect x="830" y="230" width="150" height="44" rx="8"/>
    <rect x="830" y="308" width="150" height="44" rx="8"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="bold" fill="#0b0b0b">
    <text x="905" y="101">Weather API</text>
    <text x="905" y="179">Database</text>
    <text x="905" y="257">E-mail</text>
    <text x="905" y="335">Files</text>
  </g>

  <text x="755" y="396" text-anchor="middle" font-size="14" font-style="italic" fill="#52514e">3 + 4 = 7 connections, one protocol</text>
</svg>
